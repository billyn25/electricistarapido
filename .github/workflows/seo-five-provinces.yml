name: SEO ciudades y cinco provincias
on:
  push:
    branches: [main]
    paths: ['content/seo-navigation.json', 'scripts/seo-strengthen.mjs', 'tests/seo-strengthen*', 'package.json', 'netlify.toml', '.github/workflows/seo-five-provinces.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-five-provinces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar, comprobar SEO y preservar contactos regionales
        run: npm run build:release
      - name: Contrastar las 573 URLs publicadas con los archivos generados
        run: node tests/seo-strengthen-live.mjs
      - name: Preparar navegador de comprobación
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Comprobar ciudades, distritos y servicios en móvil y escritorio
        run: python tests/seo-strengthen-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-cinco-provincias-verificado
          path: |
            reports/seo/
            reports/seo-five-provinces-build.json
            .cache/regional-contact-build.json
          include-hidden-files: true
          retention-days: 14
