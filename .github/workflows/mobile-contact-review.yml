name: Guardar contacto móvil verificado
on:
  push:
    branches: [review/mobile-contact]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conservar exactamente el cambio probado en 37447787271
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('scripts/build.mjs');s=p.read_text()
          def replace(a,b):
              global s
              assert s.count(a)==1,(a[:120],s.count(a))
              s=s.replace(a,b)
          replace('<style>${css}</style></head>', '<style>${css}</style><link rel="stylesheet" href="/mobile-contact.css?v=1"><script src="/mobile-contact.js?v=1" defer></script></head>')
          replace('content="width=device-width,initial-scale=1"','content="width=device-width,initial-scale=1,viewport-fit=cover"')
          replace('<a class="btn yellow" href="tel:${site.tel}">☎ URGENCIAS 24H · ${site.phone}</a>','<a class="btn yellow primary-call" href="tel:${site.tel}"><span class="primary-call-text"><span class="primary-call-label">☎ URGENCIAS 24H</span><span class="primary-call-separator"> · </span><span class="primary-call-number">${site.phone}</span></span></a>')
          replace('<div class="mobile-bar"><a class="btn yellow" href="tel:${site.tel}">☎ Urgencias 24h · ${site.phone}</a><a class="btn wa" href="https://wa.me/${site.whatsapp}">WhatsApp</a></div>', '<div class="mobile-bar" hidden role="group" aria-label="Contacto rápido"><a class="btn yellow mobile-call" href="tel:${site.tel}"><span class="mobile-call-label">Llamar · 24h</span><strong class="mobile-call-number">${site.phone}</strong></a><a class="btn wa" href="https://wa.me/${site.whatsapp}">WhatsApp</a></div>')
          s+='\n// Small local assets: no extra libraries or external requests.\nfor(const asset of ["mobile-contact.css","mobile-contact.js"])await fs.copyFile(path.resolve("public",asset),path.join(out,asset));\n'
          p.write_text(s)
          p=Path('package.json');d=json.loads(p.read_text());d['scripts']['check']='node --check scripts/build.mjs && node --check public/mobile-contact.js && npm run build && node --test tests/*.test.mjs';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm run check > reports/check.log 2>&1
          git diff --check
          tar --exclude=.git --exclude=dist --exclude=reports -czf reports/sources.tar.gz .
      - name: Guardar solo código de la web
        run: |
          git add scripts/build.mjs package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Conecta los controles móviles comprobados y sus pruebas'
          git push origin HEAD:review/mobile-contact
          git rev-parse HEAD > reports/source-commit.txt
          git ls-tree -r HEAD > reports/source-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electricista-mobile-sources
          path: reports/
