name: Calidad y vista previa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: recursos-v1-${{ hashFiles('content/site.mjs') }}
      - name: Construcción, pruebas y auditoría completa
        run: npm run check
      - name: Preparar navegadores de pruebas
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Móvil, escritorio, fotos y navegación
        run: python tests/browser.py
      - name: Servicios municipales, enlaces y formulario (Chromium y WebKit)
        env:
          TEST_WEBKIT: '1'
        run: python tests/browser-local.py
      - name: Resumen de la revisión
        if: always()
        run: |
          node -e "const fs=require('fs'); if(fs.existsSync('reports/local-content.json')) {const r=JSON.parse(fs.readFileSync('reports/local-content.json')); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Electricista Rápido\n'+r.pages+' páginas · '+r.towns+' municipios · '+r.services+' servicios desarrollados · '+r.homeTownLinks+' enlaces municipales desde el inicio\n')}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electricistarapido-web-y-revision
          path: |
            dist/
            reports/
          retention-days: 14
